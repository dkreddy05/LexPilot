name: LexPilot CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # Backend: Spring Boot 3 + Java 21 + Maven
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests
        working-directory: ./lexpilot-app
        run: ./mvnw test -Dtest=ReciprocalRankFusionTest,HybridSearchServiceTest,HeuristicLowConfidenceGuardrailTest,CitationFormatterTest,ConversationServiceTest,DocumentUploadServiceTest,SecurityConfigTest

  # ---------------------------------------------------------------------------
  # Embedding Service: FastAPI + Python 3.11
  # ---------------------------------------------------------------------------
  embedding-test:
    name: Embedding Service Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./embedding-service
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        working-directory: ./embedding-service
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  # ---------------------------------------------------------------------------
  # Frontend: Next.js 15 + TypeScript
  # ---------------------------------------------------------------------------
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type Check & Build
        working-directory: ./frontend
        run: npm run build
