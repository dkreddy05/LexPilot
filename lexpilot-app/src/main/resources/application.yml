spring:
  application:
    name: lexpilot-app

  # ---------------------------------------------------------------------------
  # Database — PostgreSQL with pgvector
  # ---------------------------------------------------------------------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lexpilot}
    username: ${SPRING_DATASOURCE_USERNAME:lexpilot}
    password: ${SPRING_DATASOURCE_PASSWORD:lexpilot_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none  # schema managed by Flyway migrations
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

  # ---------------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------------
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: lexpilot-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.lexpilot.*"

  # ---------------------------------------------------------------------------
  # Virtual Threads — Java 21 / Project Loom
  # ---------------------------------------------------------------------------
  threads:
    virtual:
      enabled: true  # TODO: validate performance under load; disable if Pinning issues arise

  # ---------------------------------------------------------------------------
  # Security — Permit actuator endpoints without auth
  # ---------------------------------------------------------------------------
  security:
    api-key:
      header-name: X-Api-Key
      # TODO: Move to a secrets manager (AWS Secrets Manager / Vault) in production.
      #       For local dev, the key is set via the LEXPILOT_API_KEY env var.

  # ---------------------------------------------------------------------------
  # Multipart file upload limits
  # ---------------------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server:
  port: 8080
  servlet:
    context-path: /

# ---------------------------------------------------------------------------
# LexPilot custom configuration namespace
# ---------------------------------------------------------------------------
lexpilot:
  tenant:
    enabled: true
    default-tenant-id: 00000000-0000-0000-0000-000000000000

  embedding-service:
    base-url: ${LEXPILOT_EMBEDDING_SERVICE_URL:http://localhost:8000}
    # TODO: configure connection pool / timeout when implementing

  llm:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    default-model: gpt-4o
    fast-model: gpt-4o-mini
    max-tokens: 1024
    temperature: 0.2
    timeout-seconds: 30

  ingestion:
    kafka-topic: lexpilot.ingestion.documents
    chunk-size: 500      # approximate token count per chunk
    chunk-overlap: 75    # ~15% overlap
    upload-dir: ${LEXPILOT_UPLOAD_DIR:./uploads}
    max-file-size-mb: 20

  retrieval:
    vector-top-k: 20
    bm25-top-k: 20
    rrf-top-k: 10  # final candidates after fusion

  security:
    enabled: false  # API key auth is fully implemented — set to true to activate (enabled in Docker Compose by default)

  rate-limiting:
    enabled: false  # Per-IP rate limiting (Bucket4j in-memory) — activates with lexpilot.security.enabled=true
    requests-per-minute: 60  # Tune without redeploy via LEXPILOT_RATE_LIMITING_REQUESTS_PER_MINUTE env var
    requests-per-day: 1000

  conversation:
    max-history-turns: 10  # Number of prior user+assistant turn pairs threaded into the LLM prompt

  cors:
    allowed-origins: ${LEXPILOT_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---------------------------------------------------------------------------
# Production Profile (spring.profiles.active=prod)
# ---------------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: prod
  
  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 20000

logging:
  level:
    root: INFO
    com.lexpilot: INFO
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSZ}","level":"%p","thread":"%t","logger":"%logger{36}","message":"%m"}%n'
