  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f0f1a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #graph {
      flex: 1;
    }

    #sidebar {
      width: 280px;
      background: #1a1a2e;
      border-left: 1px solid #2a2a4e;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #view-controls {
      padding: 10px 12px;
      border-bottom: 1px solid #2a2a4e;
    }
    #view-controls h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 8px;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn-group button {
      background: #0f0f1a;
      border: 1px solid #3a3a5e;
      color: #ccc;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-group button:hover {
      border-color: #6366f1;
      color: #fff;
      background: #1e1e38;
    }
    .btn-group button.active {
      background: #4338ca;
      border-color: #6366f1;
      color: #fff;
    }
    #graph-loader {
      position: absolute;
      top: 50%;
      left: calc(50% - 140px);
      transform: translate(-50%, -50%);
      background: rgba(15, 15, 26, 0.92);
      border: 1px solid #3a3a5e;
      border-radius: 8px;
      padding: 18px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 100;
      pointer-events: none;
      transition: opacity 0.3s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #2a2a4e;
      border-top: 3px solid #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #loader-text {
      font-size: 13px;
      color: #cbd5e1;
    }
    #search-wrap {
      padding: 12px;
      border-bottom: 1px solid #2a2a4e;
    }

    #search {
      width: 100%;
      background: #0f0f1a;
      border: 1px solid #3a3a5e;
      color: #e0e0e0;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    #search:focus {
      border-color: #4E79A7;
    }

    #search-results {
      max-height: 140px;
      overflow-y: auto;
      padding: 4px 12px;
      border-bottom: 1px solid #2a2a4e;
      display: none;
    }

    .search-item {
      padding: 4px 6px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-item:hover {
      background: #2a2a4e;
    }

    #info-panel {
      padding: 14px;
      border-bottom: 1px solid #2a2a4e;
      min-height: 140px;
    }

    #info-panel h3 {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #info-content {
      font-size: 13px;
      color: #ccc;
      line-height: 1.6;
    }

    #info-content .field {
      margin-bottom: 5px;
    }

    #info-content .field b {
      color: #e0e0e0;
    }

    #info-content .empty {
      color: #555;
      font-style: italic;
    }

    .neighbor-link {
      display: block;
      padding: 2px 6px;
      margin: 2px 0;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-left: 3px solid #333;
    }

    .neighbor-link:hover {
      background: #2a2a4e;
    }

    #neighbors-list {
      max-height: 160px;
      overflow-y: auto;
      margin-top: 4px;
    }

    #legend-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    #legend-wrap h3 {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
    }

    .legend-item:hover {
      background: #2a2a4e;
      padding-left: 4px;
    }

    .legend-item.dimmed {
      opacity: 0.35;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .legend-count {
      color: #666;
      font-size: 11px;
    }

    #stats {
      padding: 10px 14px;
      border-top: 1px solid #2a2a4e;
      font-size: 11px;
      color: #555;
    }

    #legend-controls {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    #legend-controls button {
      flex: 1;
      background: #0f0f1a;
      border: 1px solid #3a3a5e;
      color: #aaa;
      padding: 4px 0;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    #legend-controls button:hover {
      border-color: #4E79A7;
      color: #e0e0e0;
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      #sidebar {
        width: 100%;
        height: auto;
        max-height: 40vh;
        border-left: none;
        border-top: 1px solid #2a2a4e;
        overflow-y: auto;
      }
      #graph { min-height: 50vh; }
    }

    .btn-group button:focus,
    #legend-controls button:focus,
    .legend-item:focus,
    .neighbor-link:focus {
      outline: 2px solid #6366f1;
      outline-offset: 2px;
    }

      var btn = document.getElementById('btn-physics');
      if (btn) {
        btn.classList.toggle('active', physicsEnabled);
        btn.textContent = physicsEnabled ? 'Physics: On' : 'Physics: Off';
      }
      network.setOptions({ physics: { enabled: physicsEnabled } });
    }

    function showInfo(nodeId) {
      if (!nodesDS || !network) return;
      var n = nodesDS.get(nodeId);
      if (!n) return;
      var infoContainer = document.getElementById('info-content');
      infoContainer.textContent = ''; // clear safely

      function addField(labelText, value) {
        var div = document.createElement('div');
        div.className = 'field';
        if (labelText) {
          var b = document.createElement('b');
          b.textContent = labelText + ': ';
          div.appendChild(b);
          div.appendChild(document.createTextNode(value));
        } else {
          var b2 = document.createElement('b');
          b2.textContent = value;
          div.appendChild(b2);
        }
        infoContainer.appendChild(div);
      }

      addField(null, n.label);
      addField('Type', n._file_type || 'unknown');
      addField('Community', n._community_name || 'unknown');
      addField('Source', n._source_file || '-');
      addField('Degree', String(n._degree));

      var neighborIds = network.getConnectedNodes(nodeId);
      if (neighborIds.length) {
        var header = document.createElement('div');
        header.className = 'field';
        header.style.marginTop = '8px';
        header.style.color = '#aaa';
        header.style.fontSize = '11px';
        header.textContent = 'Neighbors (' + neighborIds.length + ')';
        infoContainer.appendChild(header);

        var list = document.createElement('div');
        list.id = 'neighbors-list';
        neighborIds.forEach(function(nid) {
          var nb = nodesDS.get(nid);
          var link = document.createElement('span');
          link.className = 'neighbor-link';
          link.style.borderLeftColor = nb ? nb.color.background : '#555';
          link.textContent = nb ? nb.label : String(nid);
          link.tabIndex = 0;
          link.setAttribute('role', 'button');
          link.addEventListener('click', function() { focusNode(nid); });
          link.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); focusNode(nid); }
          });
          list.appendChild(link);
        });
        infoContainer.appendChild(list);
      }
    }

    function focusNode(nodeId) {
      if (!network) return;
      network.focus(nodeId, { scale: 1.4, animation: true });
      network.selectNodes([nodeId]);
      showInfo(nodeId);
    }

    function toggleAllCommunities(hide) {
      document.querySelectorAll('.legend-item').forEach(function(item) {
        hide ? item.classList.add('dimmed') : item.classList.remove('dimmed');
      });
      if (window._hiddenCommunities) {
        LEGEND.forEach(function(c) {
          if (hide) window._hiddenCommunities.add(c.cid); else window._hiddenCommunities.delete(c.cid);
        });
      }
      var updates = RAW_NODES.map(function(n) { return { id: n.id, hidden: hide }; });
      nodesDS.update(updates);
    }

  </script>
  <script>
    // Render hyperedges as shaded regions
    var hyperedges = [];
    // afterDrawing passes ctx already transformed to network coordinate space.
    // Draw node positions raw — no manual pan/zoom/DPR math needed.
    document.addEventListener('DOMContentLoaded', function() {
      // Wait for start() to create network
      setTimeout(function attachHyperedgeRenderer() {
        if (typeof network === 'undefined' || !network) {
          setTimeout(attachHyperedgeRenderer, 500);
          return;
        }
        network.on('afterDrawing', function (ctx) {
      if (!hyperedges.length) return; // guard: no hyperedges to render
      hyperedges.forEach(h => {
        const positions = h.nodes
          .map(nid => network.getPositions([nid])[nid])
          .filter(p => p !== undefined);
        if (positions.length < 2) return;
        ctx.save();
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = '#6366f1';
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        // Centroid and expanded hull in network coordinates
        const cx = positions.reduce((s, p) => s + p.x, 0) / positions.length;
        const cy = positions.reduce((s, p) => s + p.y, 0) / positions.length;
        const expanded = positions.map(p => ({
          x: cx + (p.x - cx) * 1.15,
          y: cy + (p.y - cy) * 1.15
        }));
        ctx.moveTo(expanded[0].x, expanded[0].y);
        expanded.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 0.4;
        ctx.stroke();
        // Label
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = '#4f46e5';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(h.label, cx, cy - 5);
        ctx.restore();
      });
    });
      }, 100);
    });
  </script>
